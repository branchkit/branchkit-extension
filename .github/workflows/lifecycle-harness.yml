# Lifecycle harness (DESIGN_LIFECYCLE_HARNESS.md) — the protocol half of
# soak as a CI job. Path-gated to the surfaces it actually covers (pool,
# liveness, routing, the harness itself) so it costs minutes only when
# protocol code changes. Non-required (continue-on-error) until it proves
# flake-clean for a couple of weeks; promote by removing that line.
name: lifecycle-harness

on:
  push:
    branches: [main]
    paths:
      - 'src/labels/**'
      - 'src/plugin/**'
      - 'src/background.ts'
      - 'src/background/**'
      - 'src/lifecycle/**'
      - 'src/debug/pool-audit.ts'
      - 'scripts/harness/**'
      - 'test-fixtures/lifecycle/**'
  pull_request:
    paths:
      - 'src/labels/**'
      - 'src/plugin/**'
      - 'src/background.ts'
      - 'src/background/**'
      - 'src/lifecycle/**'
      - 'src/debug/pool-audit.ts'
      - 'scripts/harness/**'
      - 'test-fixtures/lifecycle/**'

jobs:
  chromium:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Installs BOTH "Chrome for Testing" and "Chrome Headless Shell". The
      # full build is the one that matters: scripts/lib/launch.mjs passes
      # `channel: 'chromium'` when headless because the SHELL cannot load
      # extensions — the service worker never registers and the harness dies
      # on waitForEvent("serviceworker"). Do not narrow this to --only-shell.
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # xvfb is REDUNDANT since the harnesses went headless by default
      # (2026-07-28) and is kept only as belt-and-braces: if the headless
      # default is ever reverted or overridden, this job keeps working instead
      # of failing on a missing display. It is not load-bearing.
      - run: xvfb-run -a npm run harness:lifecycle
